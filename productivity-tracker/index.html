// Local YYYY-MM-DD. The original used toISOString(), which is UTC: in Melbourne
// that gives yesterday's date until 10-11am, breaking habits, streaks and "today".
const pad = n => String(n).padStart(2, "0");
const dateStr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => dateStr(new Date());
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

const lsGet = (k, fallback) => { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

const escapeHtml = s => String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const textToHtml = t => escapeHtml(t).replace(/\n/g, "<br>");
const sanitize = html => window.DOMPurify ? window.DOMPurify.sanitize(html || "") : escapeHtml(html);
const stripHtml = html => { const d = document.createElement("div"); d.innerHTML = sanitize(html); return (d.textContent || "").trim(); };

const hasApiKey = () => !!loadSettings().apiKey;

class AIError extends Error {}

// Single entry point for every AI feature. Calls the Anthropic API directly from
// the browser with the user's own key (stored only in this browser).
async function callClaude({ system, messages, max_tokens = 1000 }) {
  const s = loadSettings();
  if (!s.apiKey) throw new AIError("AI is off: no API key saved. Open Settings (top right) to add your Anthropic API key. Every non-AI feature works without it.");
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": s.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: s.model || DEFAULT_MODEL, max_tokens, system, messages }),
    });
  } catch { throw new AIError("Could not reach the Anthropic API. Check your internet connection."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new AIError("AI error " + res.status + ": " + (data.error?.message || res.statusText));
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n") || "No response.";
}
const aiErrorText = e => (e instanceof AIError ? e.message : "Something went wrong: " + (e?.message || e));

// The API requires the first message to come from the user. Chats here start with
// an assistant turn, so we prepend the opener that produced it.
const toApiMessages = (opener, msgs) => [{ role: "user", content: opener }, ...msgs.map(m => ({ role: m.role, content: m.text }))];

// Fixed: the original only set innerHTML on mount, so AI-generated text written
// into a field never appeared until you navigated away and back.
function RichTextarea({ value, onChange, rows, placeholder }) {
  const ref = useRef(null);
  const composing = useRef(false);
  useEffect(() => {
    const el = ref.current;
    const clean = sanitize(value || "");
    if (el && document.activeElement !== el && el.innerHTML !== clean) el.innerHTML = clean;
  }, [value]);
  const emit = () => { if (!composing.current) onChange(ref.current.innerHTML); };
  const exec = cmd => { document.execCommand(cmd, false); ref.current.focus(); emit(); };
  const toolBtn = (label, cmd) => (
    <button type="button" onMouseDown={e => { e.preventDefault(); exec(cmd); }}
      style={{ ...btn, padding:"2px 8px", fontSize:12, lineHeight:1.4, border:"0.5px solid var(--color-border-tertiary)" }}>{label}</button>
  );
  return (
    <div style={{ border:"0.5px solid var(--color-border-tertiary)", borderRadius:8, overflow:"hidden", background:"var(--color-background-primary)" }}>
      <div style={{ display:"flex", gap:4, padding:"4px 6px", borderBottom:"0.5px solid var(--color-border-tertiary)", flexWrap:"wrap", background:"var(--color-background-secondary)" }}>
        {toolBtn("B","bold")}{toolBtn("I","italic")}{toolBtn("U","underline")}{toolBtn("List","insertUnorderedList")}{toolBtn("1. List","insertOrderedList")}{toolBtn("Clear","removeFormat")}
      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning onInput={emit}
        onCompositionStart={() => composing.current = true}
        onCompositionEnd={() => { composing.current = false; emit(); }}
        data-placeholder={placeholder}
        style={{ minHeight:`${(rows||3)*1.6}rem`, padding:"8px 10px", fontSize:14, lineHeight:1.7, color:"var(--color-text-primary)", outline:"none", overflowY:"auto" }} />
    </div>
  );
}

const Html = ({ html, style }) => <div style={style} dangerouslySetInnerHTML={{ __html: sanitize(html) }} />;

function StrengthInput({ color, onAdd, placeholder }) {
  const [val, setVal] = useState("");
  const add = () => { if (val.trim()) { onAdd(val); setVal(""); } };
  return (
    <div style={{ display:"flex", gap:6 }}>
      <input value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => { if (e.key === "Enter") add(); }} style={{ ...inp, flex:1, fontSize:13 }} placeholder={placeholder} />
      <button onClick={add} style={{ ...btn, fontSize:12, padding:"6px 12px", color, borderColor:`${color}66` }}>Add</button>
    </div>
  );
}

function ReflectionEditor({ initialValue, onSave, onCancel }) {
  const [val, setVal] = useState(initialValue || "");
  return (
    <div>
      <textarea value={val} onChange={e => setVal(e.target.value)} rows={5} style={{ ...inp, resize:"vertical", marginBottom:8, lineHeight:1.7 }} placeholder="Write your answer here - be honest and specific. This is just for you." autoFocus />
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => onSave(val)} style={{ ...btnP, flex:1 }}>Save answer</button>
        {onCancel && <button onClick={onCancel} style={{ ...btn, flex:1 }}>Cancel</button>}
      </div>
    </div>
  );
}

/* =========================================================================
   Missions (no AI)
   ========================================================================= */

function MissionsTab({ state, save }) {
  const missions = state.missions || [];
  const [showAddM, setShowAddM] = useState(false);
  const [editingMission, setEditingMission] = useState(null);
  const [newMission, setNewMission] = useState(emptyMission);
  const today = todayStr();

  const addMission = () => {
    if (!newMission.title.trim()) return;
    save({ ...state, missions:[...missions, { ...newMission, id:uid(), created:Date.now() }] });
    setNewMission(emptyMission); setShowAddM(false);
  };
  const saveMissionEdit = () => { save({ ...state, missions:missions.map(m => m.id === editingMission.id ? editingMission : m) }); setEditingMission(null); };
  const deleteMission = id => { if (confirm("Delete this mission?")) save({ ...state, missions:missions.filter(m => m.id !== id) }); };
  const cycleStatus = (e, id) => {
    e.stopPropagation();
    save({ ...state, missions:missions.map(m => m.id !== id ? m : { ...m, status:MISSION_STATUSES[(MISSION_STATUSES.indexOf(m.status) + 1) % MISSION_STATUSES.length] }) });
  };

  const sorted = [...missions].sort((a, b) => {
    const sd = MISSION_STATUSES.indexOf(a.status) - MISSION_STATUSES.indexOf(b.status); if (sd) return sd;
    const pd = PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority); if (pd) return pd;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    return a.due ? -1 : b.due ? 1 : 0;
  });
  const isOverdue = m => m.due && m.due < today && m.status !== "Done";
  const overdue = sorted.filter(isOverdue);
  const active = sorted.filter(m => !isOverdue(m) && m.status !== "Done");
  const done = sorted.filter(m => m.status === "Done");

  const MCard = ({ m }) => {
    const od = isOverdue(m);
    const daysLeft = m.due ? daysBetween(today, m.due) : null;
    return (
      <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderLeft:"3px solid " + (priorityColor[m.priority] || "#888"), borderRadius:8, padding:12, marginBottom:8, opacity:m.status === "Done" ? 0.6 : 1 }}>
        <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:4 }}>
              <span style={{ fontSize:14, fontWeight:500, textDecoration:m.status === "Done" ? "line-through" : "none", color:m.status === "Done" ? "var(--color-text-tertiary)" : "var(--color-text-primary)" }}>{m.title}</span>
              <button onClick={e => cycleStatus(e, m.id)} title="Click to change status" style={{ fontSize:11, padding:"2px 8px", borderRadius:20, border:"none", cursor:"pointer", background:MISSION_STATUS_BG[m.status], color:MISSION_STATUS_COLORS[m.status], fontWeight:500 }}>{m.status}</button>
              <span style={{ fontSize:11, background:"var(--color-background-secondary)", borderRadius:4, padding:"2px 6px", color:priorityColor[m.priority] }}>{m.priority}</span>
            </div>
            {m.description && <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:4 }}>{m.description}</div>}
            <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
              {m.due && <span style={{ fontSize:12, color:od ? "#e24b4a" : daysLeft <= 3 ? "#ba7517" : "var(--color-text-secondary)" }}>{od ? "Overdue: " : "Due: "}{m.due}{!od && daysLeft <= 7 ? " (" + daysLeft + "d)" : ""}</span>}
              {m.notes && <span style={{ fontSize:12, color:"var(--color-text-tertiary)", fontStyle:"italic" }}>{m.notes.slice(0, 60)}{m.notes.length > 60 ? "..." : ""}</span>}
            </div>
          </div>
          <div style={{ display:"flex", gap:6, flexShrink:0 }}>
            <button onClick={() => setEditingMission({ ...m })} style={{ ...btn, padding:"4px 8px", fontSize:12 }}>Edit</button>
            <button onClick={() => deleteMission(m.id)} style={{ ...btn, padding:"4px 8px", fontSize:12, color:"#e24b4a", borderColor:"#e24b4a" }}>x</button>
          </div>
        </div>
      </div>
    );
  };

  const form = (m, set) => <>
    <Field label="Mission title"><input value={m.title} onChange={e => set(x => ({ ...x, title:e.target.value }))} style={inp} placeholder="What is your mission?" /></Field>
    <Field label="Description"><input value={m.description || ""} onChange={e => set(x => ({ ...x, description:e.target.value }))} style={inp} placeholder="What does success look like?" /></Field>
    <Field label="Priority"><select value={m.priority} onChange={e => set(x => ({ ...x, priority:e.target.value }))} style={inp}>{PRIORITIES.map(p => <option key={p}>{p}</option>)}</select></Field>
    <Field label="Status"><select value={m.status} onChange={e => set(x => ({ ...x, status:e.target.value }))} style={inp}>{MISSION_STATUSES.map(s => <option key={s}>{s}</option>)}</select></Field>
    <Field label="Due date"><input type="date" value={m.due || ""} onChange={e => set(x => ({ ...x, due:e.target.value }))} style={inp} /></Field>
    <Field label="Notes"><input value={m.notes || ""} onChange={e => set(x => ({ ...x, notes:e.target.value }))} style={inp} placeholder="Any notes or context..." /></Field>
  </>;

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
        <div style={{ fontSize:15, fontWeight:500 }}>My missions</div>
        <button onClick={() => setShowAddM(true)} style={btnP}>+ Add mission</button>
      </div>
      <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:16 }}>Your prioritised goals and missions. Click the status badge to cycle through Not started, In progress and Done.</div>
      {missions.length === 0 && <div style={{ fontSize:14, color:"var(--color-text-secondary)", padding:"1rem 0" }}>No missions yet. Add your first mission!</div>}
      {overdue.length > 0 && <div style={{ marginBottom:16 }}><div style={{ fontSize:12, fontWeight:500, color:"#e24b4a", marginBottom:8 }}>Overdue ({overdue.length})</div>{overdue.map(m => <MCard key={m.id} m={m} />)}</div>}
      {active.length > 0 && <div style={{ marginBottom:16 }}><div style={{ fontSize:12, fontWeight:500, color:"var(--color-text-secondary)", marginBottom:8 }}>Active ({active.length})</div>{active.map(m => <MCard key={m.id} m={m} />)}</div>}
      {done.length > 0 && <details style={{ marginBottom:8 }}><summary style={{ fontSize:12, fontWeight:500, color:"var(--color-text-secondary)", cursor:"pointer", marginBottom:8 }}>Completed ({done.length})</summary>{done.map(m => <MCard key={m.id} m={m} />)}</details>}

      <Modal show={showAddM} onClose={() => setShowAddM(false)} title="Add mission">
        {form(newMission, setNewMission)}
        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button onClick={addMission} style={{ ...btnP, flex:1 }}>Add mission</button>
          <button onClick={() => setShowAddM(false)} style={{ ...btn, flex:1 }}>Cancel</button>
        </div>
      </Modal>
      <Modal show={!!editingMission} onClose={() => setEditingMission(null)} title="Edit mission">
        {editingMission && <>
          {form(editingMission, setEditingMission)}
          <div style={{ display:"flex", gap:8, marginTop:16 }}>
            <button onClick={saveMissionEdit} style={{ ...btnP, flex:1 }}>Save</button>
            <button onClick={() => setEditingMission(null)} style={{ ...btn, flex:1 }}>Cancel</button>
          </div>
        </>}
      </Modal>
    </div>
  );
}

/* =========================================================================
   Strengths (mostly no AI; CV analysis and role suggestions use AI)
   ========================================================================= */

function StrengthsTab({ state, save }) {
  const strengths = state.strengths || defaultState.strengths;
  const reflectionAnswers = state.reflectionAnswers || {};
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState("");
  const [aiIsError, setAiIsError] = useState(false);
  const [activeQ, setActiveQ] = useState(null);
  const [editingQ, setEditingQ] = useState({});

  const updateSection = (section, arr) => save({ ...state, strengths:{ ...strengths, [section]:arr } });
  const addStrength = (section, value) => { if (value.trim()) updateSection(section, [...(strengths[section] || []), value.trim()]); };
  const removeStrength = (section, idx) => updateSection(section, (strengths[section] || []).filter((_, i) => i !== idx));
  const saveAnswer = (id, val) => { save({ ...state, reflectionAnswers:{ ...reflectionAnswers, [id]:val } }); setEditingQ(p => ({ ...p, [id]:false })); };

  const analyseCV = async () => {
    if (!state.cv) { setAiIsError(true); setAiResult("No CV saved - please add your CV via the My CV button first."); return; }
    setAiLoading(true); setAiResult(""); setAiIsError(false);
    try {
      const text = await callClaude({ max_tokens:1000,
        system:"You are a career coach analysing a CV to identify strengths. Be specific, evidence-based and encouraging. Plain text only, no markdown.",
        messages:[{ role:"user", content:"Analyse this CV and identify the top 5 professional strengths. Format each as a numbered line exactly like: '1. Strength name: one-sentence explanation. Evidence: one specific piece of evidence from the CV.'\n\nCV:\n" + state.cv }] });
      setAiResult(text);
    } catch (e) { setAiIsError(true); setAiResult(aiErrorText(e)); }
    setAiLoading(false);
  };

  const saveAiStrengths = () => {
    const extracted = aiResult.split("\n").map(l => l.match(/^\s*\d+[.)]\s*([^:]+):/)).filter(Boolean).map(m => m[1].trim()).slice(0, 5);
    if (extracted.length) updateSection("cv", [...new Set([...(strengths.cv || []), ...extracted])]);
  };

  const SECTIONS = [
    { key:"via",     label:"VIA Character Strengths",   color:"#534ab7", bg:"#eeedfe", desc:"Based on the VIA Survey - 24 universal character strengths like Curiosity, Kindness, Leadership.", link:"https://www.viacharacter.org/account/register", linkLabel:"Take the free VIA Survey" },
    { key:"clifton", label:"CliftonStrengths (Gallup)", color:"#185fa5", bg:"#e6f1fb", desc:"Based on Gallup CliftonStrengths - 34 talent themes like Achiever, Learner, Relator.", link:"https://www.gallup.com/cliftonstrengths/en/253868/popular-cliftonstrengths-assessment-products.aspx", linkLabel:"Take the CliftonStrengths Assessment" },
    { key:"cv",      label:"CV / Resume strengths",     color:"#0f6e56", bg:"#e1f5ee", desc:"Strengths identified from your CV by AI analysis or your own reflection." },
    { key:"other",   label:"Other strengths",           color:"#854f0b", bg:"#faeeda", desc:"Any other strengths identified through feedback, mentors, or self-reflection." },
  ];

  return (
    <div>
      <div style={{ fontSize:15, fontWeight:500, marginBottom:4 }}>Strengths finder</div>
      <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:20 }}>Discover and save your top strengths from multiple sources. Use these in interviews, your CV and LinkedIn.</div>

      <div style={{ background:"#e1f5ee", border:"0.5px solid #9fe1cb", borderRadius:12, padding:"1rem", marginBottom:20 }}>
        <div style={{ fontSize:14, fontWeight:500, color:"#0f6e56", marginBottom:4 }}>AI strengths analysis from your CV<AIBadge /></div>
        <div style={{ fontSize:13, color:"#0f6e56", opacity:0.85, marginBottom:10 }}>Claude reads your saved CV and identifies your top 5 professional strengths with evidence.</div>
        {!state.cv && <div style={{ fontSize:12, color:"#ba7517", background:"#faeeda", borderRadius:8, padding:"6px 10px", marginBottom:10 }}>No CV saved - add it via the My CV button first.</div>}
        <button onClick={analyseCV} disabled={aiLoading} style={{ ...btnP, background:"#1d9e75", color:"#fff" }}>{aiLoading ? "Analysing..." : "Analyse my CV for strengths"}</button>
        {aiResult && (
          <div style={{ marginTop:12 }}>
            <div style={{ background:"#fff", border:"0.5px solid #9fe1cb", borderRadius:8, padding:"10px 12px", fontSize:13, lineHeight:1.7, whiteSpace:"pre-wrap", color:aiIsError ? "#993c1d" : "#085041", marginBottom:8 }}>{aiResult}</div>
            {!aiIsError && <button onClick={saveAiStrengths} style={{ ...btn, fontSize:12, color:"#0f6e56", borderColor:"#0f6e56" }}>Save top strengths to CV strengths section</button>}
          </div>
        )}
      </div>

      {SECTIONS.map(sec => (
        <div key={sec.key} style={{ background:sec.bg, border:`0.5px solid ${sec.color}33`, borderRadius:12, padding:"1rem", marginBottom:16 }}>
          <div style={{ fontSize:14, fontWeight:500, color:sec.color, marginBottom:4 }}>{sec.label}</div>
          <div style={{ fontSize:12, color:sec.color, opacity:0.8, marginBottom:sec.link ? 8 : 10 }}>{sec.desc}</div>
          {sec.link && <a href={sec.link} target="_blank" rel="noopener noreferrer" style={{ fontSize:12, color:sec.color, fontWeight:500, display:"inline-block", marginBottom:10 }}>{sec.linkLabel}</a>}
          <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
            {(strengths[sec.key] || []).map((s, i) => (
              <div key={i} style={{ background:"#fff", border:`0.5px solid ${sec.color}44`, borderRadius:20, padding:"4px 10px", fontSize:13, color:sec.color, display:"flex", alignItems:"center", gap:6 }}>
                <span>{s}</span>
                <button onClick={() => removeStrength(sec.key, i)} style={{ background:"none", border:"none", cursor:"pointer", color:sec.color, opacity:0.6, fontSize:14, padding:0, lineHeight:1 }}>x</button>
              </div>
            ))}
            {!(strengths[sec.key] || []).length && <div style={{ fontSize:12, color:sec.color, opacity:0.6 }}>No strengths added yet.</div>}
          </div>
          <StrengthInput color={sec.color} onAdd={val => addStrength(sec.key, val)} placeholder={"Add a " + sec.label.toLowerCase() + " strength..."} />
        </div>
      ))}

      {Object.values(strengths).some(arr => arr.length > 0) && (
        <div style={{ background:"var(--color-background-secondary)", borderRadius:12, padding:"1rem", marginBottom:24 }}>
          <div style={{ fontSize:14, fontWeight:500, marginBottom:8 }}>Your strength profile</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {Object.entries(strengths).flatMap(([k, arr]) => arr.map(s => ({ s, color:SECTIONS.find(sec => sec.key === k)?.color || "#888" }))).map(({ s, color }, i) => (
              <span key={i} style={{ background:"var(--color-background-primary)", border:`0.5px solid ${color}44`, borderRadius:20, padding:"4px 12px", fontSize:13, color }}>{s}</span>
            ))}
          </div>
        </div>
      )}

      <div style={{ borderTop:"0.5px solid var(--color-border-tertiary)", paddingTop:20, marginBottom:24 }}>
        <div style={{ fontSize:15, fontWeight:500, marginBottom:4 }}>Section 1 - Reflection questions</div>
        <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:16 }}>Let us identify what may need to change. Take your time with each question - there are no right or wrong answers.</div>
        {REFLECTION_QUESTIONS.map((q, qi) => {
          const answer = reflectionAnswers[q.id] || "";
          const isEditing = editingQ[q.id];
          const isOpen = activeQ === q.id || isEditing;
          return (
            <div key={q.id} style={{ marginBottom:12, background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderLeft:"3px solid #534ab7", borderRadius:8, overflow:"hidden" }}>
              <button onClick={() => setActiveQ(isOpen && !isEditing ? null : q.id)} style={{ ...btn, width:"100%", textAlign:"left", border:"none", borderRadius:0, padding:"12px 14px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                <div>
                  <div style={{ fontSize:12, color:"#534ab7", fontWeight:500, marginBottom:2 }}>Question {qi + 1}</div>
                  <div style={{ fontSize:14, fontWeight:500 }}>{q.question}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
                  {answer && !isEditing && <span style={{ fontSize:11, background:"#eeedfe", color:"#534ab7", borderRadius:4, padding:"2px 8px" }}>Answered</span>}
                  <span style={{ fontSize:14, color:"var(--color-text-secondary)" }}>{isOpen ? "▲" : "▼"}</span>
                </div>
              </button>
              {isOpen && (
                <div style={{ padding:"0 14px 14px" }}>
                  {isEditing || !answer ? (
                    <ReflectionEditor initialValue={answer} onSave={val => saveAnswer(q.id, val)} onCancel={() => { setEditingQ(p => ({ ...p, [q.id]:false })); if (!answer) setActiveQ(null); }} />
                  ) : (
                    <div>
                      <div style={{ fontSize:13, lineHeight:1.8, background:"var(--color-background-secondary)", borderRadius:8, padding:"10px 12px", marginBottom:10, whiteSpace:"pre-wrap" }}>{answer}</div>
                      <button onClick={() => setEditingQ(p => ({ ...p, [q.id]:true }))} style={{ ...btn, fontSize:12, padding:"4px 12px", color:"#534ab7", borderColor:"#534ab7" }}>Edit answer</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <FeedbackTableSection state={state} save={save} />
      <MyThoughtsSection state={state} save={save} />
      <AISuggestedRolesSection state={state} />
    </div>
  );
}

    </div>
  );
}

function AISuggestedRolesSection({ state }) {
  const [roles, setRoles] = useState("");
  const [loading, setLoading] = useState(false);
  const buildContext = () => {
    const s = state.strengths || {};
    const j = a => (a || []).join(", ") || "not provided";
    const r = state.reflectionAnswers || {};
    const feedback = (state.feedbackTable?.rows || []).filter(x => x.name).map(x => `${x.name}: thinks(${x.think}), people(${x.people}), communicates(${x.communicate}), other(${x.other})`).join("; ");
    const t = state.myThoughts || {};
    return `Based on the following profile, suggest roles this person would enjoy and excel in.

Strengths:
- VIA character strengths: ${j(s.via)}
- CliftonStrengths: ${j(s.clifton)}
- CV strengths: ${j(s.cv)}
- Other strengths: ${j(s.other)}

Reflection answers:
- What they enjoy most: ${r.enjoy || "not provided"}
- What they are known for: ${r.known || "not provided"}
- Their top strengths: ${r.strengths || "not provided"}
- What makes them special: ${r.special || "not provided"}

Feedback from others: ${feedback || "not provided"}

Personal reflections: ${[t.patterns, t.surprised, t.actions].filter(Boolean).join(" ") || "not provided"}

CV summary: ${(state.cv || "").slice(0, 800) || "not provided"}

Please suggest 8-12 specific roles this person would enjoy and be well suited to. For each role list just the role name as a bullet point. Then add a brief paragraph explaining the common themes across these suggestions.`;
  };
  const suggest = async () => {

  };
  return (

}

// Fixed: section switching now works from the "AI: LinkedIn" tab (the original
// passed no-op setters there), and the conversation sent to the API starts with a user turn.
function LinkedInReviewChat({ savedSections, onBack }) {
  const [liSection, setLiSection] = useState("Headline");
  const [liContent, setLiContent] = useState(() => ({ ...(savedSections || {}) }));
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [started, setStarted] = useState(false);
  const chatRef = useRef(null);
  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [messages, loading]);

  const opener = () => "Please review my LinkedIn " + liSection + " and give specific feedback and a rewritten version.";
  const sysPrompt = () => "You are an expert LinkedIn profile coach reviewing the " + liSection + " section. Current content:\n\n\"" + (liContent[liSection] || "(not provided)") + "\"\n\nHelp improve through conversation. Offer specific rewrites, ask clarifying questions, refine based on feedback. Be encouraging, specific, concise. Plain text.";
  const run = async msgs => {
    setLoading(true);
    try { const text = await callClaude({ max_tokens:1500, system:sysPrompt(), messages:toApiMessages(opener(), msgs) }); setMessages([...msgs, { role:"assistant", text }]); }
    catch (e) { setMessages([...msgs, { role:"assistant", text:aiErrorText(e) }]); }
    setLoading(false);
  };
  const startReview = async () => {
    setStarted(true);
    if (!(liContent[liSection] || "").trim()) { setMessages([{ role:"assistant", text:"Please paste your " + liSection + " content above first." }]); return; }
    setLoading(true);
    try { setMessages([{ role:"assistant", text:await callClaude({ max_tokens:1500, system:sysPrompt(), messages:[{ role:"user", content:opener() }] }) }]); }
    catch (e) { setMessages([{ role:"assistant", text:aiErrorText(e) }]); }
    setLoading(false);
  };
  const send = () => { if (!input.trim() || loading) return; const msgs = [...messages, { role:"user", text:input.trim() }]; setInput(""); setMessages(msgs); run(msgs); };
  const reset = () => { setMessages([]); setStarted(false); setInput(""); };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
      {onBack && <button onClick={onBack} style={{ ...btn, fontSize:13, alignSelf:"flex-start" }}>Back</button>}
      <div style={{ fontSize:16, fontWeight:500 }}>LinkedIn profile review<AIBadge /></div>
      <NoKeyNotice />
      <div style={{ fontSize:13, color:"var(--color-text-secondary)" }}>Select a section, paste content, then chat to refine it.</div>
      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
        {LI_SECTIONS.map(s => <button key={s} onClick={() => { setLiSection(s); reset(); }} style={{ ...btn, fontSize:12, padding:"4px 12px", background:liSection === s ? "#534ab7" : "transparent", color:liSection === s ? "#fff" : "var(--color-text-secondary)", border:`0.5px solid ${liSection === s ? "#534ab7" : "var(--color-border-tertiary)"}` }}>{s}</button>)}
      </div>
      <div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
          <div style={{ fontSize:12, color:"var(--color-text-secondary)" }}>Your current {liSection} content</div>
          {savedSections?.[liSection] && <div style={{ fontSize:11, color:"#1d9e75" }}>Pre-loaded from My CV</div>}
        </div>
        <textarea value={liContent[liSection] || ""} onChange={e => { setLiContent(p => ({ ...p, [liSection]:e.target.value })); if (started) reset(); }} rows={4} style={{ ...inp, resize:"vertical" }} placeholder={"Paste your LinkedIn " + liSection + " here..."} />
      </div>
      {!started
        ? <button onClick={startReview} style={{ ...btnPurple, width:"100%" }}>Review {liSection}</button>
        : <div>
            <ChatLog messages={messages} loading={loading} chatRef={chatRef} maxH={380} />
            <div style={{ display:"flex", gap:8 }}>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} style={{ ...inp, flex:1 }} placeholder="Ask for tweaks..." />
              <button onClick={send} disabled={loading} style={{ ...btnPurple, whiteSpace:"nowrap" }}>Send</button>
            </div>
            <button onClick={reset} style={{ ...btn, fontSize:12, marginTop:8, color:"var(--color-text-tertiary)" }}>Start over</button>
          </div>}
    </div>
  );
}

// Fixed: saveSession / deleteSession / continueSession / clearActiveSession were
// defined inside LinkedInReviewChat in the original, so "Save and exit" crashed here.
const IV_ACTIVE = "pt_interview_active_v2";
const IV_SESSIONS = "pt_interview_sessions";
const IV_OPENER = "I am ready to start.";

function InterviewPracticeChat({ state, onBack }) {
  const saved = lsGet(IV_ACTIVE, null);
  const [phase, setPhase] = useState(saved?.messages?.length ? "chat" : "setup");
  const [sessionId, setSessionId] = useState(saved?.id || null);
  const [selectedApp, setSelectedApp] = useState(saved?.selectedApp || null);
  const [questionTypes, setQuestionTypes] = useState(saved?.questionTypes || ["behavioural","situational","competency"]);
  const [messages, setMessages] = useState(saved?.messages || []);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [savedSessions, setSavedSessions] = useState(() => lsGet(IV_SESSIONS, []));
  const chatRef = useRef(null);

  useEffect(() => { if (messages.length) lsSet(IV_ACTIVE, { id:sessionId, selectedApp, questionTypes, messages }); }, [messages]);
  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [messages, loading]);

  const persistSessions = list => { setSavedSessions(list); lsSet(IV_SESSIONS, list); };
  const saveAndExit = () => {
    if (messages.length) {
      const session = { id:sessionId || Date.now(), date:new Date().toLocaleDateString("en-AU"), role:selectedApp ? selectedApp.role + " @ " + selectedApp.company : "General practice", selectedApp, questionTypes, messages, messageCount:messages.filter(m => m.role === "user").length };
      persistSessions([session, ...savedSessions.filter(s => s.id !== session.id)].slice(0, 10));
    }
    lsDel(IV_ACTIVE); setMessages([]); setSessionId(null); setPhase("setup");
  };
  const deleteSession = id => { if (confirm("Delete this saved session?")) persistSessions(savedSessions.filter(s => s.id !== id)); };
  const continueSession = s => { setSessionId(s.id); setSelectedApp(s.selectedApp || null); setQuestionTypes(s.questionTypes || ["behavioural"]); setMessages(s.messages || []); setPhase("chat"); };
  const toggleType = id => setQuestionTypes(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);

  const buildSystem = () => {
    const role = selectedApp ? selectedApp.role + " at " + selectedApp.company : "a general role";
    const jd = selectedApp ? "JD notes: " + (stripHtml(selectedApp.jdNotes) || "none") : "";
    const types = questionTypes.map(t => QUESTION_TYPES.find(q => q.id === t)?.label).join(", ");
    const achievements = (state.achievements || []).slice(0, 8).map(a => "- " + a.title + ": " + stripHtml(a.action) + " => " + stripHtml(a.result)).join("\n");
    const prev = savedSessions.filter(s => s.id !== sessionId).slice(0, 3).map((s, i) => "Session " + (i + 1) + " (" + s.date + "): " + s.role + " - sample answers: " + s.messages.filter(m => m.role === "user").slice(0, 5).map(m => m.text).join(" | ").slice(0, 400)).join("\n\n");
    return INTERVIEW_GUIDE + "\n\nYou are an expert interview coach running a mock session. Track improvement across sessions. Plain text, no markdown.\n\nRole: " + role + "\n" + jd + "\nCV: " + (state.cv || "(No CV provided)").slice(0, 1200) + "\nAchievements:\n" + (achievements || "(none)") + "\nQuestion types: " + types +
      (prev ? "\n\nPREVIOUS SESSION HISTORY (for tracking improvement):\n" + prev + "\n\nAs the session progresses, note improvements compared to previous sessions. Reference specific growth in clarity, use of CAR structure, specificity and authenticity." : "") +
      "\n\nIf there are already messages in the conversation, this is a CONTINUED session - do not re-introduce yourself. Ask one question at a time, give CAR coaching feedback after each answer, mix types, offer a progress summary every 3-4 questions.";
  };
  const run = async msgs => {
    setLoading(true);
    try { const text = await callClaude({ max_tokens:1500, system:buildSystem(), messages:toApiMessages(IV_OPENER, msgs) }); setMessages([...msgs, { role:"assistant", text }]); }
    catch (e) { setMessages([...msgs, { role:"assistant", text:aiErrorText(e) }]); }
    setLoading(false);
  };
  const startSession = async () => {
    setSessionId(Date.now()); setPhase("chat"); setLoading(true);
    try { setMessages([{ role:"assistant", text:await callClaude({ max_tokens:1000, system:buildSystem(), messages:[{ role:"user", content:IV_OPENER }] }) }]); }
    catch (e) { setMessages([{ role:"assistant", text:aiErrorText(e) }]); }
    setLoading(false);
  };
  const send = () => { if (!input.trim() || loading) return; const msgs = [...messages, { role:"user", text:input.trim() }]; setInput(""); setMessages(msgs); run(msgs); };
  const getSummary = () => { if (loading) return; const msgs = [...messages, { role:"user", text:"Give me a full performance summary - strengths, improvements, tips for my real interview." }]; setMessages(msgs); run(msgs); };

  if (phase === "setup") return (
    <div>
      {onBack && <button onClick={onBack} style={{ ...btn, marginBottom:16, fontSize:13 }}>Back</button>}
      <div style={{ fontSize:16, fontWeight:500, marginBottom:4 }}>Interview practice<AIBadge /></div>
      <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:16 }}>Powered by the JobAccelerator 22 Ways framework.</div>
      <NoKeyNotice />
      <div style={{ fontSize:13, fontWeight:500, marginBottom:8 }}>Select a job to practise for</div>
      <div style={{ marginBottom:16 }}>
        {[null, ...state.applications].map(a => {
          const sel = (selectedApp?.id || null) === (a?.id || null);
          return (
            <div key={a?.id || "general"} onClick={() => setSelectedApp(a)} style={{ background:sel ? "#eeedfe" : "var(--color-background-primary)", border:"0.5px solid " + (sel ? "#7f77dd" : "var(--color-border-tertiary)"), borderRadius:8, padding:"10px 12px", marginBottom:6, cursor:"pointer" }}>
              <div style={{ fontSize:13, fontWeight:500, color:sel ? "#3c3489" : "var(--color-text-primary)" }}>{a ? a.role + " @ " + a.company : "General practice (no specific role)"}</div>
              {a && <div style={{ fontSize:11, color:"var(--color-text-secondary)", marginTop:2 }}>{a.stage}</div>}
            </div>
          );
        })}
      </div>
      <div style={{ fontSize:13, fontWeight:500, marginBottom:8 }}>Question types</div>
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:20 }}>
        {QUESTION_TYPES.map(t => { const on = questionTypes.includes(t.id); return <button key={t.id} onClick={() => toggleType(t.id)} style={{ ...btn, fontSize:12, padding:"5px 12px", background:on ? t.color : "transparent", color:on ? "#fff" : "var(--color-text-secondary)", border:"0.5px solid " + (on ? t.color : "var(--color-border-tertiary)") }}>{t.label}</button>; })}
      </div>
      <button onClick={startSession} disabled={questionTypes.length === 0} style={{ ...btnPurple, width:"100%" }}>Start new interview practice</button>

      {savedSessions.length > 0 && (
        <div style={{ marginTop:20, borderTop:"0.5px solid var(--color-border-tertiary)", paddingTop:16 }}>
          <div style={{ fontSize:14, fontWeight:500, marginBottom:6 }}>Previous sessions</div>
          <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginBottom:10 }}>Your answers from previous sessions are used by the AI coach to track your improvement over time. Saved in this browser only (last 10).</div>
          {savedSessions.map(s => (
            <div key={s.id} style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:8, padding:"10px 12px", marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
              <div>
                <div style={{ fontSize:13, fontWeight:500 }}>{s.role}</div>
                <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginTop:2 }}>{s.date} - {s.messageCount} answer{s.messageCount !== 1 ? "s" : ""}</div>
              </div>
              <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                <button onClick={() => continueSession(s)} style={{ ...btnPurple, fontSize:12, padding:"4px 12px" }}>Continue</button>
                <button onClick={() => deleteSession(s.id)} style={{ ...btn, fontSize:12, padding:"4px 8px", color:"#e24b4a", borderColor:"#e24b4a" }}>x</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, gap:8 }}>
        <button onClick={saveAndExit} style={{ ...btn, fontSize:13 }}>Save and exit</button>
        <div style={{ fontSize:12, color:"var(--color-text-secondary)", textAlign:"center" }}>{selectedApp ? selectedApp.role + " @ " + selectedApp.company : "General"}</div>
        <button onClick={getSummary} disabled={loading} style={{ ...btnPurple, fontSize:12, padding:"5px 12px" }}>Get summary</button>
      </div>
      <div style={{ fontSize:11, color:"#1d9e75", marginBottom:10, textAlign:"center" }}>Session auto-saved in this browser - you can safely leave and return</div>
      <ChatLog messages={messages} loading={loading} chatRef={chatRef} maxH={460} label="Interview Coach" />
      <div style={{ display:"flex", gap:8 }}>
        <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} rows={3} style={{ ...inp, flex:1, resize:"none" }} placeholder="Type your answer... (Enter to send, Shift+Enter for new line)" />
        <button onClick={send} disabled={loading} style={{ ...btnPurple, alignSelf:"flex-end" }}>Send</button>
      </div>
    </div>
  );
}

function getStreak(habit) {
  let s = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (habit.completedDates.includes(dateStr(d))) s++;
    else if (i > 0) break;
  }
  return s;
}

    const apps = (state.applications || []).slice(0, 10).map(a => a.role + " at " + a.company + "(" + a.stage + ")").join("; ");
    const contacts = (state.contacts || []).slice(0, 10).map(c => c.name + (c.company ? " @ " + c.company : "") + " - " + (c.category || "contact")).join("; ");

  const [showAddContact, setShowAddContact] = useState(false);

  const [editingAchievement, setEditingAchievement] = useState(null);
  const [editingResource, setEditingResource] = useState(null);
  const [editingWin, setEditingWin] = useState(null);
  const [resourceFilter, setResourceFilter] = useState("All");
  const [aiResponse, setAiResponse] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiField, setAiField] = useState("");
  const [pomActive, setPomActive] = useState(false);
  const [pomSecs, setPomSecs] = useState(25 * 60);
  const [pomMode, setPomMode] = useState("work");
  const [celebrate, setCelebrate] = useState(false);
  const [newTask, setNewTask] = useState(emptyTask);
  const [newHabit, setNewHabit] = useState(emptyHabit);
  const [newApp, setNewApp] = useState(emptyApp);
  const [newContact, setNewContact] = useState(emptyContact);
  const [newAchievement, setNewAchievement] = useState(emptyAchievement);
  const [newResource, setNewResource] = useState(emptyResource);
  const [win, setWin] = useState("");
  const [reflection, setReflection] = useState("");
  const [energy, setEnergy] = useState(3);
  const [mood, setMood] = useState(3);
  const [weeklyGoalInput, setWeeklyGoalInput] = useState(() => loadState().weeklyGoal || "");
  const [today, setToday] = useState(todayStr);

  // Keep "today" correct if the tab is left open past midnight.
  useEffect(() => { const id = setInterval(() => setToday(t => { const n = todayStr(); return n !== t ? n : t; }), 60000); return () => clearInterval(id); }, []);

  // save() accepts an object or an updater function. The updater form is used after
  // async AI calls so that edits made while waiting are not overwritten.
  const save = nextOrFn => setState(prev => {
    const next = typeof nextOrFn === "function" ? nextOrFn(prev) : nextOrFn;
    if (!lsSet(STATE_KEY, next)) setStorageWarning("Could not save to browser storage (it may be full or blocked). Export your data now.");
    return next;
  });
  const saveChecks = next => { setStepChecks(next); lsSet(CHECKS_KEY, next); };
  const flash = () => { setCelebrate(true); setTimeout(() => setCelebrate(false), 2200); };

  const selectedApp = state.applications.find(a => a.id === selectedAppId) || null;
  const selectedContact = state.contacts.find(c => c.id === selectedContactId) || null;
  const currentStep = STEPS.find(s => s.id === activeStep);
  const handleStepChange = id => { setActiveStep(id); setTab(SUB_TABS[id][0]); setAiResponse(""); };
  const stepProgress = step => ({ done:step.checks.filter((_, i) => stepChecks[step.id + "_" + i]).length, total:step.checks.length });

  const toggleCheck = (stepId, idx) => {
    const key = stepId + "_" + idx;
    const next = { ...stepChecks, [key]:!stepChecks[key] };
    saveChecks(next);
    const step = STEPS.find(s => s.id === stepId);
    if (!stepChecks[key] && step.checks.every((_, i) => next[stepId + "_" + i])) { setStepCelebrate(stepId); setTimeout(() => setStepCelebrate(null), 4000); }
  };

  const syncHabitTasks = s => {
    const t = todayStr(); const dow = new Date().getDay();
    let tasks = [...s.tasks];
    (s.habits || []).forEach(h => {
      const applies = h.freq === "daily" || (h.freq === "weekdays" && dow >= 1 && dow <= 5) || (h.freq === "weekly" && dow === 1);
      if (!applies || tasks.some(x => x.habitId === h.id && x.due === t)) return;
      tasks.push({ id:uid(), title:"[Habit] " + h.title, desc:"Habit", duration:15, due:t, priority:"Medium", category:"Focus", deps:[], done:h.completedDates.includes(t), created:Date.now(), habitId:h.id });
    });
    return { ...s, tasks };
  };
  useEffect(() => { save(prev => { const synced = syncHabitTasks(prev); return synced.tasks.length !== prev.tasks.length ? synced : prev; }); }, [state.habits.length, today]);

  // Pomodoro based on an end timestamp, so it stays accurate when the tab is in the background.
  const pomEnd = useRef(null);
  useEffect(() => {
    if (!pomActive) return;
    pomEnd.current = Date.now() + pomSecs * 1000;
    const id = setInterval(() => {
      const left = Math.max(0, Math.round((pomEnd.current - Date.now()) / 1000));
      setPomSecs(left);
      if (left === 0) {
        clearInterval(id); setPomActive(false);
        setPomMode(m => { const n = m === "work" ? "break" : "work"; setPomSecs(n === "break" ? 5 * 60 : 25 * 60); return n; });
        try { new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play(); } catch {}
      }
    }, 500);
    return () => clearInterval(id);
  }, [pomActive]);
  const fmt = s => pad(Math.floor(s / 60)) + ":" + pad(s % 60);

  // ---- Tasks
  const toggleTask = id => {
    const task = state.tasks.find(t => t.id === id); if (!task) return;
    const habits = !task.habitId ? state.habits : state.habits.map(h => h.id !== task.habitId ? h : { ...h, completedDates:h.completedDates.includes(today) ? h.completedDates.filter(d => d !== today) : [...h.completedDates, today] });
    save({ ...state, tasks:state.tasks.map(t => t.id === id ? { ...t, done:!t.done } : t), habits });
    if (!task.done) { flash(); setTimeout(() => save(prev => ({ ...prev, tasks:prev.tasks.map(t => t.id === id && t.done ? { ...t, archived:true } : t) })), 2500); }
  };
  const addTask = () => { if (!newTask.title.trim()) return; save({ ...state, tasks:[...state.tasks, { ...newTask, id:uid(), done:false, created:Date.now() }] }); setNewTask(emptyTask); setShowAdd(false); };
  const deleteTask = id => save({ ...state, tasks:state.tasks.filter(t => t.id !== id) });
  const restoreTask = id => save({ ...state, tasks:state.tasks.map(t => t.id === id ? { ...t, archived:false, done:false } : t) });
  const saveTaskEdit = () => { save({ ...state, tasks:state.tasks.map(t => t.id === editingTask.id ? editingTask : t) }); setEditingTask(null); };
  const autoScheduled = () => {
    const tasks = state.tasks.filter(t => !t.archived).sort((a, b) => {
      const pd = PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority); if (pd) return pd;
      if (a.due && b.due) return a.due.localeCompare(b.due);
      return a.due ? -1 : b.due ? 1 : 0;
    });
    const all = state.tasks;
    return tasks.map(t => ({ ...t, blocked:(t.deps || []).some(d => { const dep = all.find(x => x.id === d || x.title === d); return dep && !dep.done; }) }));
  };

  // ---- Habits
  const addHabit = () => { if (!newHabit.title.trim()) return; save(syncHabitTasks({ ...state, habits:[...state.habits, { ...newHabit, id:uid(), completedDates:[] }] })); setNewHabit(emptyHabit); setShowAddHabit(false); };
  const toggleHabit = id => {
    const habit = state.habits.find(h => h.id === id); if (!habit) return;
    const already = habit.completedDates.includes(today);
    save({ ...state,
      habits:state.habits.map(h => h.id === id ? { ...h, completedDates:already ? h.completedDates.filter(d => d !== today) : [...h.completedDates, today] } : h),
      tasks:state.tasks.map(t => t.habitId === id && t.due === today ? { ...t, done:!already } : t) });
    if (!already) flash();
  };
  const saveHabitEdit = () => { save({ ...state, habits:state.habits.map(h => h.id === editingHabit.id ? editingHabit : h) }); setEditingHabit(null); };
  const deleteHabit = id => { if (!confirm("Delete this habit and its history?")) return; save({ ...state, habits:state.habits.filter(h => h.id !== id), tasks:state.tasks.filter(t => t.habitId !== id) }); setEditingHabit(null); };

  // ---- Applications / contacts
  const addApp = () => { if (!newApp.company.trim()) return; save({ ...state, applications:[...state.applications, { ...newApp, id:uid() }] }); setNewApp(emptyApp); setShowAddApp(false); };
  const updateAppField = (id, field, value) => save(prev => ({ ...prev, applications:prev.applications.map(a => a.id === id ? { ...a, [field]:value } : a) }));
  const deleteApp = id => { if (!confirm("Delete this application?")) return; save({ ...state, applications:state.applications.filter(a => a.id !== id) }); setSelectedAppId(null); };
  const addContact = () => { if (!newContact.name.trim()) return; save({ ...state, contacts:[...state.contacts, { ...newContact, id:uid() }] }); setNewContact(emptyContact); setShowAddContact(false); };
  const updateContactField = (id, field, value) => save(prev => ({ ...prev, contacts:prev.contacts.map(c => c.id === id ? { ...c, [field]:value } : c) }));
  const deleteContact = id => { if (!confirm("Delete this contact?")) return; save({ ...state, contacts:state.contacts.filter(c => c.id !== id) }); setSelectedContactId(null); };

  // ---- Achievements / resources
  const addAchievement = () => { if (!newAchievement.title.trim()) return; save({ ...state, achievements:[...(state.achievements || []), { ...newAchievement, id:uid(), created:Date.now() }] }); setNewAchievement(emptyAchievement); setShowAddAchievement(false); };
  const saveAchievementEdit = () => { save({ ...state, achievements:state.achievements.map(a => a.id === editingAchievement.id ? editingAchievement : a) }); setEditingAchievement(null); };
  const deleteAchievement = id => { if (confirm("Delete this achievement?")) save({ ...state, achievements:state.achievements.filter(a => a.id !== id) }); };
  const addResource = () => { if (!newResource.title.trim()) return; save({ ...state, resources:[...(state.resources || []), { ...newResource, id:uid(), created:Date.now() }] }); setNewResource(emptyResource); setShowAddResource(false); };
  const saveResourceEdit = () => { save({ ...state, resources:state.resources.map(r => r.id === editingResource.id ? editingResource : r) }); setEditingResource(null); };
  const deleteResource = id => save({ ...state, resources:state.resources.filter(r => r.id !== id) });
  const resourceCategories = ["All", ...new Set((state.resources || []).map(r => r.category).filter(Boolean))];

  // ---- Weekly
  const saveCheckIn = () => save({ ...state, checkIn:{ energy, mood, date:today } });
  const addWin = () => { if (!win.trim()) return; save({ ...state, wins:[{ text:win, date:today, id:uid() }, ...state.wins] }); setWin(""); flash(); };
  const saveWinEdit = () => { save({ ...state, wins:state.wins.map(w => w.id === editingWin.id ? editingWin : w) }); setEditingWin(null); };
  const toggleWinArchive = id => save({ ...state, wins:state.wins.map(w => w.id === id ? { ...w, archived:!w.archived } : w) });
  const deleteWin = id => save({ ...state, wins:state.wins.filter(w => w.id !== id) });
  const saveReflection = () => { if (!reflection.trim()) return; save({ ...state, reflections:[{ text:reflection, date:today, id:uid() }, ...state.reflections] }); setReflection(""); };

  // ---- Import / export (file download added; the API key is never exported)
  const exportJson = () => JSON.stringify({ ...state, _checks:stepChecks, _exported:new Date().toISOString() }, null, 2);
  const downloadExport = () => {
    const blob = new Blob([exportJson()], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "productivity-tracker-" + today + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const applyImport = text => {
    try {
      const parsed = JSON.parse(text);
      if (typeof parsed !== "object" || !parsed || Array.isArray(parsed)) throw new Error();
      const { _checks, _exported, ...rest } = parsed;
      if (!confirm("Replace ALL current data with the imported file?")) return;
      save({ ...defaultState, ...rest }); if (_checks) saveChecks(_checks);
      setWeeklyGoalInput(rest.weeklyGoal || ""); setImportText(""); setImportMsg("Imported."); setShowImportExport(false);
    } catch { setImportMsg("Invalid file - paste or choose a file exported from this tracker."); }
  };
  const importFile = e => { const f = e.target.files?.[0]; if (!f) return; f.text().then(applyImport); e.target.value = ""; };

  // ---- AI (general coach + per-application generation)
  const askAI = async (prompt, targetField, appId) => {
    setAiLoading(true); setAiField(targetField || ""); setAiResponse("");
    try {
      const ctx = JSON.stringify({ today, name:state.myName, tasks:state.tasks.filter(t => !t.archived).slice(0, 20).map(({ title, priority, due, done, category }) => ({ title, priority, due, done, category })), habits:state.habits.map(h => ({ title:h.title, freq:h.freq, streak:getStreak(h) })), missions:state.missions, applications:state.applications.slice(0, 10).map(({ company, role, stage, date }) => ({ company, role, stage, date })), wins:state.wins.slice(0, 5), checkIn:state.checkIn, weeklyGoal:state.weeklyGoal, cvExcerpt:(state.cv || "").slice(0, 1500) });
      const text = await callClaude({ max_tokens:targetField === "resume" || targetField === "coverLetter" ? 2500 : 1000, system:"You are a supportive productivity and career coach. Concise, warm, actionable. Plain text, no markdown.", messages:[{ role:"user", content:"Context: " + ctx + "\n\n" + prompt }] });
      setAiResponse(text);
      if (targetField && appId) updateAppField(appId, targetField, textToHtml(text));
    } catch (e) { setAiResponse(aiErrorText(e)); setAiField(""); }
    setAiLoading(false);
  };
  const askAppAI = type => {
    if (!selectedApp) return;
    const cv = state.cv || "(No CV provided)";
    const jd = "Job: " + selectedApp.role + " at " + selectedApp.company + ". JD: " + (stripHtml(selectedApp.jdNotes) || "none") + ".";
    const map = { evaluate:["Evaluate fit, strengths, gaps, and recommend whether to apply.","evaluation"], resume:["Generate a tailored resume. Use only facts in the CV; do not invent experience.","resume"], cover:["Write a compelling cover letter. Use only facts in the CV.","coverLetter"] };
    const [instr, field] = map[type];
    if (selectedApp[field] && stripHtml(selectedApp[field]) && !confirm("This will replace the current " + field + " text. Continue?")) return;
    askAI(jd + "\nCV:\n" + cv + "\n" + instr, field, selectedApp.id);
  };

  const completedToday = state.tasks.filter(t => t.done && !t.habitId && (t.due === today || !t.due)).length;
  const habitsToday = state.habits.filter(h => h.completedDates.includes(today)).length;
  const appsThisWeek = state.applications.filter(a => a.date && daysBetween(a.date, today) >= 0 && daysBetween(a.date, today) < 7).length;
  const card = { background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:8, padding:"10px 12px", marginBottom:8 };

  return (
    <div style={{ fontFamily:"var(--font-sans)", color:"var(--color-text-primary)", maxWidth:760, margin:"0 auto", padding:"1rem 16px 3rem" }}>
      {celebrate && <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center" }}><div style={{ fontSize:64, animation:"popIn 0.4s ease" }}>🎉</div></div>}

      {stepCelebrate && (() => {
        const s = STEPS.find(x => x.id === stepCelebrate);
        const next = STEPS[STEPS.findIndex(x => x.id === stepCelebrate) + 1];
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:998, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }} onClick={() => setStepCelebrate(null)}>
            <div style={{ background:s.bg, border:"2px solid " + s.color, borderRadius:24, padding:"2rem", textAlign:"center", maxWidth:360, animation:"stepPop 0.5s ease" }}>
              <div style={{ fontSize:56, marginBottom:12 }}>🎉</div>
              <div style={{ fontSize:22, fontWeight:500, color:s.text, marginBottom:8 }}>{s.emoji} {s.label} complete!</div>
              <div style={{ fontSize:14, color:s.text, opacity:0.85, marginBottom:16 }}>You have ticked off every action in this step. Keep going!</div>
              {next ? <button onClick={() => { setStepCelebrate(null); handleStepChange(next.id); }} style={{ ...btn, padding:"10px 20px", background:next.color, color:"#fff", border:"none" }}>Next: {next.emoji} {next.label}</button>
                : <div style={{ fontSize:14, color:s.text, fontWeight:500 }}>You have completed all 6 steps! 🚀</div>}
            </div>
          </div>
        );
      })()}

      <div style={{ marginBottom:"1rem", display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12, flexWrap:"wrap" }}>
        <div>
          <div style={{ fontSize:22, fontWeight:500, marginBottom:4 }}>{state.myName ? state.myName + "'s" : "My"} Productivity Tracker</div>
          <div style={{ fontSize:13, color:"var(--color-text-secondary)" }}>{new Date().toLocaleDateString("en-AU", { weekday:"long", year:"numeric", month:"long", day:"numeric" })}</div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={() => setShowImportExport(true)} style={{ ...btnPurple, fontSize:12, padding:"6px 12px" }}>Import / Export</button>
          <button onClick={() => setShowCvModal(true)} style={{ ...btnPurple, fontSize:12, padding:"6px 12px" }}>My CV</button>
          <button onClick={() => setShowSettings(true)} style={{ ...btnPurple, fontSize:12, padding:"6px 12px" }}>Settings {hasApiKey() ? "· AI on" : "· AI off"}</button>
        </div>
      </div>

      {storageWarning && <div style={{ fontSize:13, color:"#993c1d", background:"#faece7", borderRadius:8, padding:"8px 12px", marginBottom:12 }}>{storageWarning}</div>}

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(140px, 1fr))", gap:8, marginBottom:"1rem" }}>
        {[{ label:"Tasks done today", val:completedToday },
          { label:"Habits today", val:habitsToday + "/" + state.habits.length },
          { label:"Apps last 7 days", val:appsThisWeek + "/" + state.weeklyTargetApps },
          { label:"Energy", val:state.checkIn?.date === today ? "⚡".repeat(state.checkIn.energy) : "-" },
        ].map(c => (
          <div key={c.label} style={{ background:"var(--color-background-secondary)", borderRadius:8, padding:"10px 12px" }}>
            <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginBottom:4 }}>{c.label}</div>
            <div style={{ fontSize:18, fontWeight:500 }}>{c.val}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"flex", gap:4, marginBottom:12, flexWrap:"wrap" }}>
        {STEPS.map(s => {
          const prog = stepProgress(s); const active = activeStep === s.id;
          return (
            <button key={s.id} onClick={() => handleStepChange(s.id)} style={{ ...btn, padding:"6px 12px", fontSize:13, background:active ? s.color : s.bg, color:active ? "#fff" : s.text, border:"0.5px solid " + (active ? s.color : s.bg), fontWeight:active ? 500 : 400, display:"flex", flexDirection:"column", alignItems:"center", gap:2, minWidth:80, flex:"1 1 80px" }}>
              <span>{s.emoji} {s.label}</span>
              <span style={{ fontSize:10, opacity:0.8 }}>{prog.done}/{prog.total}</span>
            </button>
          );
        })}
      </div>

      <div style={{ background:currentStep.bg, border:"0.5px solid " + currentStep.color + "22", borderRadius:12, padding:"12px 16px", marginBottom:12 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12, flexWrap:"wrap" }}>
          <div style={{ flex:"1 1 260px" }}>
            <div style={{ fontSize:15, fontWeight:500, color:currentStep.text, marginBottom:2 }}>{currentStep.emoji} {currentStep.label}</div>
            <div style={{ fontSize:13, color:currentStep.text, opacity:0.8, marginBottom:10 }}>{currentStep.tagline}</div>
            <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
              {currentStep.checks.map((check, i) => {
                const done = stepChecks[currentStep.id + "_" + i];
                return (
                  <label key={i} style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13, color:currentStep.text, opacity:done ? 0.6 : 1 }}>
                    <input type="checkbox" checked={!!done} onChange={() => toggleCheck(currentStep.id, i)} />
                    <span style={{ textDecoration:done ? "line-through" : "none" }}>{check}</span>
                  </label>
                );
              })}
            </div>
          </div>
          <details style={{ flex:"0 1 220px" }}>
            <summary style={{ fontSize:12, color:currentStep.text, cursor:"pointer", marginBottom:6, opacity:0.8 }}>Tips and AI prompts</summary>
            <div style={{ fontSize:12, color:currentStep.text, opacity:0.85 }}>
              {currentStep.tips.map((t, i) => <div key={i} style={{ marginBottom:6 }}>- {t}</div>)}
              <div style={{ marginTop:8, borderTop:"0.5px solid " + currentStep.color + "33", paddingTop:8 }}>
                {currentStep.aiPrompts.map(([label, prompt]) => (
                  <button key={label} onClick={() => askAI(prompt)} style={{ ...btn, fontSize:11, padding:"3px 8px", marginBottom:4, width:"100%", textAlign:"left", color:currentStep.text, borderColor:currentStep.color + "44" }}>{label}<AIBadge /></button>
                ))}
              </div>
            </div>
          </details>
        </div>
        {(() => { const p = stepProgress(currentStep); return (
          <div style={{ marginTop:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:currentStep.text, opacity:0.7, marginBottom:4 }}><span>Step progress</span><span>{p.done}/{p.total}</span></div>
            <div style={{ height:4, background:currentStep.color + "22", borderRadius:2 }}><div style={{ height:4, background:currentStep.color, borderRadius:2, width:(p.done / p.total * 100) + "%", transition:"width 0.3s" }} /></div>
          </div>
        ); })()}
      </div>

      {/* Fixed: general AI answers now show here; in the original they only showed inside the AI Coach tab, so step prompts looked like they did nothing. */}
      {aiField === "" && (aiLoading || aiResponse) && (
        <div style={{ ...aiBoxStyle, marginBottom:12, position:"relative" }}>
          {aiLoading ? "Thinking..." : aiResponse}
          {!aiLoading && <button onClick={() => setAiResponse("")} style={{ ...btn, position:"absolute", top:6, right:6, padding:"2px 8px", fontSize:11, color:"#0c447c", borderColor:"#b5d4f4" }}>Dismiss</button>}
        </div>
      )}

      <div style={{ display:"flex", gap:6, marginBottom:"1.5rem", flexWrap:"wrap" }}>
        {SUB_TABS[activeStep].map(t => {
          const active = tab === t; const c = currentStep;
          return <button key={t} onClick={() => setTab(t)} style={{ ...btn, background:active ? c.color : c.bg, color:active ? "#fff" : c.text, border:"0.5px solid " + (active ? c.color : c.bg), fontWeight:active ? 500 : 400, fontSize:13 }}>{t}{isAiTab(t) && !hasApiKey() ? " 🔒" : ""}</button>;
        })}
      </div>

      {tab === "Today" && (
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(240px, 1fr))", gap:12, marginBottom:"1rem" }}>
            <div style={{ ...card, borderRadius:12, padding:"1rem", marginBottom:0 }}>
              <div style={{ fontSize:14, fontWeight:500, marginBottom:12 }}>Morning check-in</div>
              <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:6 }}>Energy: {energy}/5</div>
              <input type="range" min={1} max={5} value={energy} onChange={e => setEnergy(+e.target.value)} style={{ width:"100%", marginBottom:10 }} />
              <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:6 }}>Mood: {mood}/5</div>
              <input type="range" min={1} max={5} value={mood} onChange={e => setMood(+e.target.value)} style={{ width:"100%", marginBottom:10 }} />
              <button onClick={saveCheckIn} style={{ ...btnP, width:"100%" }}>{state.checkIn?.date === today ? "Update check-in" : "Save check-in"}</button>
            </div>
            <div style={{ ...card, borderRadius:12, padding:"1rem", marginBottom:0 }}>
              <div style={{ fontSize:14, fontWeight:500, marginBottom:8 }}>Pomodoro timer</div>
              <div style={{ fontSize:36, fontWeight:500, textAlign:"center", marginBottom:8, fontVariantNumeric:"tabular-nums" }}>{fmt(pomSecs)}</div>
              <div style={{ fontSize:12, color:"var(--color-text-secondary)", textAlign:"center", marginBottom:10 }}>{pomMode === "work" ? "Focus session" : "Break time"}</div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={() => setPomActive(a => !a)} style={{ ...btnP, flex:1 }}>{pomActive ? "Pause" : "Start"}</button>
                <button onClick={() => { setPomActive(false); setPomSecs(25 * 60); setPomMode("work"); }} style={{ ...btn, flex:1 }}>Reset</button>
              </div>
            </div>
          </div>
          <div style={{ marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ fontSize:15, fontWeight:500 }}>Today's schedule</div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => setShowArchive(true)} style={{ ...btn, fontSize:12, padding:"4px 10px", color:"var(--color-text-secondary)" }}>Archive</button>
              <button onClick={() => setShowAdd(true)} style={btnP}>+ Add task</button>
            </div>
          </div>
          <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginBottom:10 }}>Sorted automatically by priority, then due date. Tasks waiting on unfinished dependencies are dimmed.</div>
          {autoScheduled().length === 0 && <div style={{ fontSize:14, color:"var(--color-text-secondary)", padding:"1rem 0" }}>No tasks yet. Add your first task!</div>}
          {autoScheduled().map(t => (
            <div key={t.id} style={{ ...card, borderLeft:"3px solid " + priorityColor[t.priority], opacity:t.blocked ? 0.5 : 1 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <input type="checkbox" checked={t.done} onChange={() => toggleTask(t.id)} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:500, textDecoration:t.done ? "line-through" : "none", color:t.done ? "var(--color-text-tertiary)" : "var(--color-text-primary)" }}>{t.title}</div>
                  <div style={{ display:"flex", gap:6, marginTop:4, flexWrap:"wrap" }}>
                    <span style={{ fontSize:11, background:"var(--color-background-secondary)", borderRadius:4, padding:"2px 6px", color:categoryColor[t.category] }}>{t.category}</span>
                    <span style={{ fontSize:11, color:"var(--color-text-secondary)" }}>{t.duration}min</span>
                    {t.due && <span style={{ fontSize:11, color:t.due < today && !t.done ? "#e24b4a" : "var(--color-text-secondary)" }}>Due: {t.due}</span>}
                    {t.blocked && <span style={{ fontSize:11, color:"#e24b4a" }}>Blocked</span>}
                    {t.habitId && <span style={{ fontSize:11, color:"#1d9e75" }}>Habit</span>}
                  </div>
                </div>
                {!t.habitId && <button onClick={() => deleteTask(t.id)} style={{ ...btn, padding:"4px 8px", fontSize:12, color:"var(--color-text-tertiary)" }}>x</button>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "Tasks" && (
        <div>
          <div style={{ marginBottom:12, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ fontSize:15, fontWeight:500 }}>All tasks</div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => setShowArchive(true)} style={{ ...btn, fontSize:12, padding:"4px 10px", color:"var(--color-text-secondary)" }}>Archive</button>
              <button onClick={() => setShowAdd(true)} style={btnP}>+ Add task</button>
            </div>
          </div>
          {state.tasks.filter(t => !t.habitId && !t.archived).length === 0 && <div style={{ fontSize:14, color:"var(--color-text-secondary)", padding:"1rem 0" }}>No open tasks.</div>}
          {state.tasks.filter(t => !t.habitId && !t.archived).map(t => (
            <div key={t.id} style={{ ...card, borderLeft:"3px solid " + priorityColor[t.priority] }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
                <input type="checkbox" checked={t.done} onChange={() => toggleTask(t.id)} style={{ marginTop:3 }} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:500, textDecoration:t.done ? "line-through" : "none" }}>{t.title}</div>
                  {t.desc && <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginTop:2 }}>{t.desc}</div>}
                  <div style={{ display:"flex", gap:6, marginTop:6, flexWrap:"wrap" }}>
                    <span style={{ fontSize:11, background:"var(--color-background-secondary)", borderRadius:4, padding:"2px 6px" }}>{t.category}</span>
                    <span style={{ fontSize:11, background:"var(--color-background-secondary)", borderRadius:4, padding:"2px 6px", color:priorityColor[t.priority] }}>{t.priority}</span>
                    <span style={{ fontSize:11, color:"var(--color-text-secondary)" }}>{t.duration}min</span>
                    {t.due && <span style={{ fontSize:11, color:"var(--color-text-secondary)" }}>{t.due}</span>}
                  </div>
                </div>
                <button onClick={() => setEditingTask({ ...t })} style={{ ...btn, padding:"4px 8px", fontSize:12 }}>Edit</button>
                <button onClick={() => deleteTask(t.id)} style={{ ...btn, padding:"4px 8px", fontSize:12, color:"var(--color-text-tertiary)" }}>x</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "Job Apps" && (!selectedApp ? (
        <div>
          <div style={{ marginBottom:12, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ fontSize:15, fontWeight:500 }}>Job applications</div>
            <button onClick={() => setShowAddApp(true)} style={btnP}>+ Add application</button>
          </div>
          {state.applications.length === 0 && <div style={{ fontSize:14, color:"var(--color-text-secondary)", padding:"1rem 0" }}>No applications yet.</div>}
          {PIPELINE_STAGES.map(stage => {
            const apps = state.applications.filter(a => a.stage === stage);
            if (!apps.length) return null;
            return (
              <div key={stage} style={{ marginBottom:16 }}>
                <div style={{ fontSize:13, fontWeight:500, color:"var(--color-text-secondary)", marginBottom:6, display:"flex", alignItems:"center", gap:6 }}>
                  <span>{stage}</span><span style={{ fontSize:11, background:"var(--color-background-secondary)", borderRadius:10, padding:"2px 8px" }}>{apps.length}</span>
                </div>
                {apps.map(a => (
                  <div key={a.id} onClick={() => setSelectedAppId(a.id)} style={{ ...card, cursor:"pointer", marginBottom:6 }}>
                    <div style={{ fontSize:14, fontWeight:500 }}>{a.role || "(role)"} @ {a.company}</div>
                    {a.date && <div style={{ fontSize:11, color:"var(--color-text-tertiary)", marginTop:2 }}>Applied {a.date}{a.date && ["Applied"].includes(a.stage) && daysBetween(a.date, today) >= 5 ? " - consider following up" : ""}</div>}
                    {a.notes && <div style={{ fontSize:12, color:"var(--color-text-secondary)", marginTop:2 }}>{stripHtml(a.notes).slice(0, 120)}</div>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      ) : (
        <div>
          <button onClick={() => setSelectedAppId(null)} style={{ ...btn, marginBottom:16, fontSize:13 }}>Back</button>
          <div style={{ fontSize:18, fontWeight:500, marginBottom:8 }}>{selectedApp.role} @ {selectedApp.company}</div>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:16 }}>
            {PIPELINE_STAGES.map(s => <button key={s} onClick={() => updateAppField(selectedApp.id, "stage", s)} style={{ ...btn, fontSize:11, padding:"3px 10px", background:selectedApp.stage === s ? "#7f77dd" : "transparent", color:selectedApp.stage === s ? "#fff" : "var(--color-text-secondary)", border:"0.5px solid " + (selectedApp.stage === s ? "#7f77dd" : "var(--color-border-tertiary)") }}>{s}</button>)}
          </div>
          <Field label="Date applied"><input type="date" value={selectedApp.date || ""} onChange={e => updateAppField(selectedApp.id, "date", e.target.value)} style={inp} /></Field>
          <div style={{ fontSize:14, fontWeight:500, marginBottom:10, marginTop:8 }}>Job description</div>
          <Field label="JD link"><input value={selectedApp.jdLink || ""} onChange={e => updateAppField(selectedApp.id, "jdLink", e.target.value)} style={inp} placeholder="https://..." /></Field>
          {selectedApp.jdLink && /^https?:\/\//.test(selectedApp.jdLink) && <a href={selectedApp.jdLink} target="_blank" rel="noopener noreferrer" style={{ fontSize:12, color:"#185fa5", display:"inline-block", marginBottom:10 }}>Open job ad</a>}
          <Field label="JD notes (paste the job ad text here; AI reads this, it cannot open the link)"><RichTextarea value={selectedApp.jdNotes || ""} onChange={v => updateAppField(selectedApp.id, "jdNotes", v)} rows={3} placeholder="Key requirements, skills..." /></Field>
          <div style={{ borderTop:"0.5px solid var(--color-border-tertiary)", paddingTop:16, marginBottom:16, marginTop:8 }}>
            <div style={{ fontSize:14, fontWeight:500, marginBottom:10 }}>AI generation<AIBadge /></div>
            <NoKeyNotice />
            {!state.cv && <div style={{ fontSize:12, color:"#ba7517", marginBottom:10 }}>No CV added - click My CV to add yours.</div>}
