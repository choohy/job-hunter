      </Modal>

      <Modal show={showAddApp} onClose={() => setShowAddApp(false)} title="Add application" maxW={440}>
        <Field label="Company"><input value={newApp.company} onChange={e => setNewApp(a => ({ ...a, company:e.target.value }))} style={inp} placeholder="Company name" /></Field>
        <Field label="Role"><input value={newApp.role} onChange={e => setNewApp(a => ({ ...a, role:e.target.value }))} style={inp} placeholder="Job title" /></Field>
        <Field label="Stage"><select value={newApp.stage} onChange={e => setNewApp(a => ({ ...a, stage:e.target.value }))} style={inp}>{PIPELINE_STAGES.map(s => <option key={s}>{s}</option>)}</select></Field>
        <Field label="JD link"><input value={newApp.jdLink} onChange={e => setNewApp(a => ({ ...a, jdLink:e.target.value }))} style={inp} placeholder="https://..." /></Field>
        <Field label="Date applied"><input type="date" value={newApp.date} onChange={e => setNewApp(a => ({ ...a, date:e.target.value }))} style={inp} /></Field>
        <Field label="Notes"><input value={newApp.notes} onChange={e => setNewApp(a => ({ ...a, notes:e.target.value }))} style={inp} placeholder="Quick notes..." /></Field>
        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button onClick={addApp} style={{ ...btnP, flex:1 }}>Add</button>
          <button onClick={() => setShowAddApp(false)} style={{ ...btn, flex:1 }}>Cancel</button>
        </div>
      </Modal>

      <Modal show={showAddContact} onClose={() => setShowAddContact(false)} title="Add contact" maxW={440}>
        <Field label="Name"><input value={newContact.name} onChange={e => setNewContact(c => ({ ...c, name:e.target.value }))} style={inp} placeholder="Full name" /></Field>
        <Field label="Category"><select value={newContact.category} onChange={e => setNewContact(c => ({ ...c, category:e.target.value }))} style={inp}><option value="">Select...</option>{CONTACT_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></Field>
        {[["role","Role","Job title"],["company","Company","Company"],["linkedin","LinkedIn","https://linkedin.com/in/..."],["howMet","How met","e.g. LinkedIn, conference..."],["nextStep","Next step","e.g. Follow up next week"],["notes","Notes","Notes"]].map(([f, l, ph]) => (
          <Field key={f} label={l}><input value={newContact[f]} onChange={e => setNewContact(c => ({ ...c, [f]:e.target.value }))} style={inp} placeholder={ph} /></Field>
        ))}
        <Field label="Date met"><input type="date" value={newContact.dateMet} onChange={e => setNewContact(c => ({ ...c, dateMet:e.target.value, lastContact:c.lastContact || e.target.value }))} style={inp} /></Field>
        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button onClick={addContact} style={{ ...btnP, flex:1 }}>Add</button>
          <button onClick={() => setShowAddContact(false)} style={{ ...btn, flex:1 }}>Cancel</button>
        </div>
      </Modal>

      {[["add", showAddAchievement, () => setShowAddAchievement(false), newAchievement, setNewAchievement, addAchievement, "Add STAR / CAR achievement", "Add achievement"],
        ["edit", !!editingAchievement, () => setEditingAchievement(null), editingAchievement, setEditingAchievement, saveAchievementEdit, "Edit achievement", "Save"]].map(([k, show, close, a, setA, onSave, title, cta]) => (
        <Modal key={k} show={show} onClose={close} title={title} maxW={560}>
          {a && <>
            <Field label="Achievement title"><input value={a.title} onChange={e => setA(x => ({ ...x, title:e.target.value }))} style={inp} placeholder="e.g. Led digital transformation project" /></Field>
            <Field label="Category"><input value={a.category || ""} onChange={e => setA(x => ({ ...x, category:e.target.value }))} style={inp} placeholder="e.g. Leadership, Technical, Delivery..." /></Field>
            <Field label="Tags (comma separated)"><input value={a.tags || ""} onChange={e => setA(x => ({ ...x, tags:e.target.value }))} style={inp} placeholder="e.g. stakeholder management, agile..." /></Field>
            <Field label="C - Context"><RichTextarea value={a.context || ""} onChange={v => setA(x => ({ ...x, context:v }))} rows={2} placeholder="What was the broader context? Company, team, timeframe..." /></Field>
            <Field label="S - Situation"><RichTextarea value={a.situation || ""} onChange={v => setA(x => ({ ...x, situation:v }))} rows={2} placeholder="What was the specific situation or challenge?" /></Field>
            <Field label="T - Task"><RichTextarea value={a.task || ""} onChange={v => setA(x => ({ ...x, task:v }))} rows={2} placeholder="What was your specific responsibility?" /></Field>
            <Field label="A - Action (use I not we)"><RichTextarea value={a.action || ""} onChange={v => setA(x => ({ ...x, action:v }))} rows={3} placeholder="What specific actions did you take?" /></Field>
            <Field label="R - Result (include numbers/timeframes)"><RichTextarea value={a.result || ""} onChange={v => setA(x => ({ ...x, result:v }))} rows={2} placeholder="What was the measurable result?" /></Field>
            <Field label="Coaching feedback"><RichTextarea value={a.coachingFeedback || ""} onChange={v => setA(x => ({ ...x, coachingFeedback:v }))} rows={3} placeholder="Notes from interview practice, mentor feedback..." /></Field>
            <div style={{ display:"flex", gap:8, marginTop:16 }}>
              <button onClick={onSave} style={{ ...btnP, flex:1 }}>{cta}</button>
              <button onClick={close} style={{ ...btn, flex:1 }}>Cancel</button>
            </div>
          </>}
        </Modal>
      ))}

      <Modal show={showAddResource} onClose={() => setShowAddResource(false)} title="Add resource" maxW={560}>
        <AddResourceModal newResource={newResource} setNewResource={setNewResource} onAdd={addResource} onClose={() => setShowAddResource(false)} />
      </Modal>

      <Modal show={!!editingResource} onClose={() => setEditingResource(null)} title="Edit resource">
        {editingResource && <>
          {[["title","Title"],["url","URL"],["category","Category"],["description","Description"],["tags","Tags"]].map(([f, l]) => (
            <Field key={f} label={l}><input value={editingResource[f] || ""} onChange={e => setEditingResource(r => ({ ...r, [f]:e.target.value }))} style={inp} /></Field>
          ))}
          <div style={{ display:"flex", gap:8, marginTop:16 }}>
            <button onClick={saveResourceEdit} style={{ ...btnP, flex:1 }}>Save</button>
            <button onClick={() => setEditingResource(null)} style={{ ...btn, flex:1 }}>Cancel</button>
          </div>
        </>}
      </Modal>

      <Modal show={showArchive} onClose={() => setShowArchive(false)} title="Completed task archive" maxW={560}>
        <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:12 }}>All previously completed and archived tasks.</div>
        {state.tasks.filter(t => t.archived).length === 0 && <div style={{ fontSize:14, color:"var(--color-text-secondary)", padding:"1rem 0" }}>No archived tasks yet.</div>}
        {state.tasks.filter(t => t.archived).reverse().map(t => (
          <div key={t.id} style={{ background:"var(--color-background-secondary)", borderLeft:"3px solid " + (priorityColor[t.priority] || "#888"), borderRadius:8, padding:"10px 12px", marginBottom:8 }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:500, textDecoration:"line-through", color:"var(--color-text-tertiary)" }}>{t.title}</div>
                <div style={{ display:"flex", gap:6, marginTop:4, flexWrap:"wrap", fontSize:11, color:"var(--color-text-tertiary)" }}>
                  <span>{t.category}</span>{t.due && <span>Due: {t.due}</span>}{t.habitId && <span style={{ color:"#1d9e75" }}>Habit</span>}
                </div>
              </div>
              <button onClick={() => restoreTask(t.id)} style={{ ...btn, fontSize:11, padding:"3px 8px", color:"#1d9e75", borderColor:"#1d9e75" }}>Restore</button>
              <button onClick={() => deleteTask(t.id)} style={{ ...btn, fontSize:11, padding:"3px 8px", color:"#e24b4a", borderColor:"#e24b4a" }}>x</button>
            </div>
          </div>
        ))}
        {state.tasks.some(t => t.archived) && (
          <button onClick={() => confirm("Permanently delete all archived tasks?") && save({ ...state, tasks:state.tasks.filter(t => !t.archived) })} style={{ ...btn, color:"#e24b4a", borderColor:"#e24b4a", width:"100%", marginTop:8, fontSize:13 }}>Clear all archived</button>
        )}
      </Modal>

      <Modal show={!!editingWin} onClose={() => setEditingWin(null)} title="Edit win" maxW={440}>
        {editingWin && <>
          <Field label="Win"><textarea value={editingWin.text} onChange={e => setEditingWin(w => ({ ...w, text:e.target.value }))} rows={3} style={{ ...inp, resize:"vertical" }} /></Field>
          <Field label="Date"><input type="date" value={editingWin.date} onChange={e => setEditingWin(w => ({ ...w, date:e.target.value }))} style={inp} /></Field>
          <div style={{ display:"flex", gap:8, marginTop:16 }}>
            <button onClick={saveWinEdit} style={{ ...btnP, flex:1 }}>Save</button>
            <button onClick={() => setEditingWin(null)} style={{ ...btn, flex:1 }}>Cancel</button>
          </div>
        </>}
      </Modal>

      <Modal show={showImportExport} onClose={() => { setShowImportExport(false); setImportText(""); setImportMsg(""); }} title="Import / Export data" maxW={560}>
        <div style={{ fontSize:13, color:"var(--color-text-secondary)", marginBottom:16, lineHeight:1.6 }}>Your data lives only in this browser's local storage. Clearing site data, private browsing, or switching device or browser means it is not there. Export regularly as a backup. Your API key is never included.</div>
        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:14, fontWeight:500, marginBottom:8 }}>Export</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            <button onClick={downloadExport} style={{ ...btnP, flex:1 }}>Download backup (.json)</button>
            <button onClick={() => navigator.clipboard.writeText(exportJson()).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); })} style={{ ...btn, flex:1 }}>{copied ? "Copied!" : "Copy to clipboard"}</button>
          </div>
        </div>
        <div style={{ borderTop:"0.5px solid var(--color-border-tertiary)", paddingTop:16 }}>
          <div style={{ fontSize:14, fontWeight:500, marginBottom:6 }}>Import</div>
          <div style={{ fontSize:12, color:"#ba7517", background:"#faeeda", borderRadius:8, padding:"8px 10px", marginBottom:10 }}>Importing replaces all current data. Download a backup first.</div>
          <input type="file" accept="application/json,.json" onChange={importFile} style={{ fontSize:13, marginBottom:10 }} />
          <textarea value={importText} onChange={e => { setImportText(e.target.value); setImportMsg(""); }} rows={5} style={{ ...inp, resize:"vertical", fontFamily:"var(--font-mono)", fontSize:12, marginBottom:8 }} placeholder="...or paste exported JSON here (also works with exports from the original Claude artifact)" />
          {importMsg && <div style={{ fontSize:12, color:"#e24b4a", marginBottom:8 }}>{importMsg}</div>}
          <button onClick={() => applyImport(importText)} disabled={!importText.trim()} style={{ ...btn, width:"100%", color:"#e24b4a", borderColor:"#e24b4a" }}>Import pasted data and replace</button>
        </div>
      </Modal>

      <Modal show={showCvModal} onClose={() => setShowCvModal(false)} title="My CV and LinkedIn Profile" maxW={640}>
        <CvLinkedInModal state={state} save={save} onClose={() => setShowCvModal(false)} />
      </Modal>

      <Modal show={showSettings} onClose={() => setShowSettings(false)} title="Settings: AI features">
        <SettingsModal onClose={() => setShowSettings(false)} />
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<noscript><p style="padding:16px">This tracker needs JavaScript enabled.</p></noscript>
</body>
</html>
